# Cấu hình duy nhất của đường ống, bám đề cương EGARCH-X ký quỹ động (bản 10/2026).
# Mọi bước đọc tham số từ đây (Phụ lục C.8). Ghi chú "(mục x.y)" chỉ nguồn trong đề cương.
# Hồ sơ "nhanh" ở cuối tệp ghi đè một số giá trị để chạy thử đường ống trên máy yếu.

